<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相簿 Gallery</title>
<meta name="description" content="Read-only cloud photo gallery">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111214">

<!-- 提早建立連線：Google Apps Script（清單）與 googleusercontent（圖片） -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com">

<!-- PWA：從主畫面開啟時不會顯示網址列 -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gallery">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- 標題與內文字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ========== Design tokens ========== */
:root{
  --bg:#111214;          /* graphite */
  --surface:#181a1d;
  --surface-2:#22252a;
  --line:rgba(255,255,255,.09);
  --text:#f0ede6;        /* paper white */
  --muted:#8f9399;
  --accent:#a6b28c;      /* sage green, matches the invitation art */
  --accent-ink:#1a1f13;
  --btn:#69715a;         /* the invitation's olive button colour */
  --btn-ink:#faf8f2;
  --cream:#efe9dd;
  --ink:#2c2a23;

  --font-display:"Cormorant Garamond","Noto Serif TC","Iowan Old Style","Palatino Linotype","Songti TC","Source Han Serif TC","PMingLiU",Georgia,serif;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--text);
  font-family:var(--font-ui);font-size:16px;line-height:1.5;
  overscroll-behavior-y:contain;
}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;animation:fade .25s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* ========== Top bar (menu + gallery) ========== */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:6px;
  padding:calc(8px + var(--safe-t)) max(10px,var(--safe-r)) 8px max(10px,var(--safe-l));
  background:rgba(17,18,20,.82);
  -webkit-backdrop-filter:saturate(1.3) blur(16px);backdrop-filter:saturate(1.3) blur(16px);
  border-bottom:1px solid var(--line);
}
.topbar-title{flex:1;min-width:0;padding:0 4px}
.topbar-title h1{margin:0;font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title p{margin:0;font-size:12.5px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;cursor:pointer}
@media (hover:hover){.icon-btn:hover{background:rgba(255,255,255,.07)}}
.text-btn{border:0;border-radius:10px;padding:9px 14px;background:rgba(240,179,90,.14);color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}

/* ========== 首頁：喜帖風格 ========== */
body{background:#3a4032}   /* 桌面版卡片外的環境色，取自照片的暗綠調 */
.home-page{padding:0}
.home-page .home-scroll{width:100%;max-width:100%;margin:0 auto;background:var(--cream);min-height:100vh;min-height:100dvh;box-shadow:none}
@media (min-width:640px){
  body:has(.home-page:not([hidden])){padding:32px 16px}
  .home-page{min-height:0;display:block}
  .home-page .home-scroll{max-width:460px;min-height:0;border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.3)}
}

.home-hero{position:relative;width:100%;aspect-ratio:622/723;overflow:hidden;background:#c9c3b4}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,8,.30) 0%,rgba(10,10,8,0) 20%,rgba(10,10,8,0) 62%,rgba(10,10,8,.62) 100%)}

.lang-switch{position:absolute;z-index:3;top:calc(12px + var(--safe-t));right:max(12px,var(--safe-r))}
.lang-btn{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 11px;border-radius:999px;
  border:1px solid rgba(255,255,255,.55);background:rgba(20,22,16,.34);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);
  color:#fff;font-size:13px;font-weight:600;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.35);cursor:pointer;
}
.lang-btn .ic{width:15px;height:15px}
.lang-btn .chev{width:13px;height:13px;transition:transform .18s ease}
.lang-switch.open .lang-btn .chev{transform:rotate(180deg)}
.lang-switch.open .lang-btn{background:rgba(20,22,16,.55)}
.lang-menu{
  position:absolute;top:calc(100% + 8px);right:0;z-index:3;min-width:132px;margin:0;padding:6px;list-style:none;
  border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(28,30,23,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 14px 30px rgba(0,0,0,.35);
}
.lang-menu li{padding:9px 12px;border-radius:9px;color:#f2efe6;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lang-menu li::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0}
.lang-menu li[aria-selected="true"]::after{opacity:1}
@media (hover:hover){.lang-menu li:hover{background:rgba(255,255,255,.1)}}

.hero-mark{position:absolute;z-index:2;left:0;right:0;top:6%;display:flex;flex-direction:column;align-items:center;gap:2px}
.hero-mark .monogram{width:clamp(96px,26vw,150px);height:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.mark-caption{margin:0;color:#fff;font-size:clamp(11px,2.6vw,13px);font-weight:600;letter-spacing:.28em;text-shadow:0 1px 3px rgba(0,0,0,.3)}

.hero-copy{position:absolute;z-index:2;left:0;right:0;bottom:6.5%;padding:0 20px;text-align:center;color:#fff}
.couple-names{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(26px,7.6vw,38px);line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.hero-tagline{margin:8px 0 0;display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--font-display);font-style:italic;font-size:clamp(14px,4vw,18px);color:#f2efe6;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hero-tagline .rule{width:30px;height:1px;background:rgba(255,255,255,.75)}

.home-paper{position:relative;background:var(--cream);padding:30px max(22px,var(--safe-r)) calc(22px + var(--safe-b)) max(22px,var(--safe-l))}
.home-paper .leaf{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none}
.leaf-tl{top:0;left:0;width:30%;max-width:168px}
.leaf-bl{bottom:0;left:0;width:30%;max-width:168px}
.leaf-br{bottom:0;right:0;width:32%;max-width:190px}
.paper-inner{position:relative;z-index:1}
.paper-buttons{display:flex;flex-direction:column;gap:14px;margin:8px 0 26px}
.paper-btn{
  display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 20px;border:0;border-radius:999px;
  background:var(--btn);color:var(--btn-ink);cursor:pointer;box-shadow:0 8px 18px rgba(60,66,48,.22);
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
}
.paper-btn:active{transform:scale(.98)}
@media (hover:hover){.paper-btn:hover{filter:brightness(1.07)}}
.paper-btn-icon{display:grid;place-items:center;flex:none}
.paper-btn-icon .ic{width:21px;height:21px}
.paper-btn-label{flex:1;text-align:left;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.01em}
.paper-btn-arrow{width:16px;height:16px;flex:none;opacity:.85}
.paper-divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 14px}
.paper-rule{width:64px;height:1px;background:#c9c2ab}
.sprig{width:30px;height:auto}
.install-hint{margin:0;text-align:center;font-size:12.5px;line-height:1.6;color:#8b8a76}

/* ========== 3. Gallery page ========== */
.g-hint{margin:0;padding:12px max(14px,var(--safe-r)) 2px max(14px,var(--safe-l));font-size:13.5px;color:var(--muted)}
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:4px;
  padding:8px max(8px,var(--safe-r)) calc(28px + var(--safe-b)) max(8px,var(--safe-l));
}
.is-selecting .grid{padding-bottom:calc(110px + var(--safe-b))}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:6px;padding-top:12px}}
@media (min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:1500px){.grid{grid-template-columns:repeat(6,1fr)}}

.tile{
  position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;cursor:pointer;
  background:linear-gradient(110deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:200% 100%;
  animation:shimmer 1.6s linear infinite;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  transition:transform .18s ease;
}
.tile.loaded{animation:none;background:var(--surface)}
.tile.broken{animation:none;background:var(--surface)}
.tile.broken::before{content:"×";position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:var(--muted)}
.tile img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  pointer-events:none;-webkit-user-drag:none;opacity:0;transition:opacity .35s ease,transform .2s ease;
}
.tile.loaded img{opacity:1}
.tile.pressing{transform:scale(.93);transition:transform .5s ease-out}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--accent);opacity:0;transition:opacity .15s;pointer-events:none}
.tile .check{
  position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;color:transparent;
  border:2px solid rgba(255,255,255,.92);background:rgba(0,0,0,.3);box-shadow:0 1px 6px rgba(0,0,0,.45);
  opacity:0;transform:scale(.6);transition:opacity .15s,transform .18s;
}
.tile .check .ic{width:15px;height:15px;stroke-width:3.2}
.is-selecting .tile .check{opacity:1;transform:scale(1)}
.tile.selected{background:var(--surface-2)}
.tile.selected img{transform:scale(.88);border-radius:5px}
.tile.selected::after{opacity:1}
.tile.selected .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.state{display:grid;justify-items:center;gap:14px;padding:90px 28px;text-align:center;color:var(--muted)}
.state p{margin:0;max-width:30ch}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:var(--accent);animation:spin .8s linear infinite}

.skeleton{padding-top:12px}
.skeleton .tile{pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Bottom download bar */
.selbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px max(14px,var(--safe-r)) calc(12px + var(--safe-b)) max(14px,var(--safe-l));
  background:rgba(24,26,29,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.selbar.show{transform:none}
.selbar .count{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:650;font-size:15px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:rgba(255,255,255,.09)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .ic{width:19px;height:19px}

/* ========== Lightbox ========== */
.lightbox{position:fixed;inset:0;z-index:50;background:#050607;animation:fade .2s ease}
.lb-top{
  position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;
  padding:calc(8px + var(--safe-t)) max(10px,var(--safe-r)) 8px max(16px,var(--safe-l));
  background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
}
.lb-counter{font-size:14px;font-weight:600;color:#d8d5cd}
.lb-actions{display:flex;gap:4px}
.lb-actions .icon-btn{color:#fff;background:rgba(255,255,255,.1)}
@media (hover:hover){.lb-actions .icon-btn:hover{background:rgba(255,255,255,.18)}}
.lb-stage{position:absolute;left:var(--safe-l);right:var(--safe-r);top:calc(60px + var(--safe-t));bottom:calc(14px + var(--safe-b))}
.lb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transition:opacity .2s}
.lb-stage img.dim{opacity:.55}
.lb-spinner{position:absolute;left:50%;top:50%;margin:-14px 0 0 -14px}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:48px;height:48px;border:0;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;
}
@media (hover:hover){.lb-nav:hover{background:rgba(255,255,255,.2)}}
.lb-nav.prev{left:16px}.lb-nav.next{right:16px}
.lb-nav:disabled{opacity:.25;cursor:default}
@media (hover:none){.lb-nav{display:none}}

/* ========== Dialog / busy / toast ========== */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(6,7,8,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s ease}
#busy{z-index:70}
.dialog{width:min(100%,340px);display:grid;justify-items:center;gap:12px;padding:26px 22px 22px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.dialog h3{margin:0;font-family:var(--font-display);font-size:24px;font-weight:600}
.dialog p{margin:0;font-size:15px;color:var(--muted)}
.dialog .btn{margin-top:6px;min-width:140px}
.bar{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.toast{
  position:fixed;left:50%;bottom:calc(28px + var(--safe-b));z-index:90;max-width:min(92vw,420px);padding:12px 18px;
  border-radius:12px;background:var(--text);color:#151412;font-size:14px;font-weight:550;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.selecting .toast{bottom:calc(92px + var(--safe-b))}

/* ========== 訪客上傳預覽 Modal 樣式 ========== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(6,7,8,.8);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  animation: fade .2s ease;
}
.modal-content {
  width: min(100%, 540px); max-height: 85vh;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; display: flex; flex-direction: column;
  overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.5);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--line);
}
.modal-header h3 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--text); }
.close-btn { background: none; border: 0; color: var(--muted); font-size: 24px; cursor: pointer; padding: 4px; line-height: 1; }
.close-btn:hover { color: var(--text); }

.pull-refresh-indicator {
  height: 0; overflow: hidden; text-align: center; font-size: 13px; color: var(--accent);
  transition: height .2s, opacity .2s; display: flex; align-items: center; justify-content: center; gap: 6px;
  background: rgba(255,255,255,.03);
}
.pull-refresh-indicator.ready { color: #fff; font-weight: 600; }

.upload-action-bar {
  padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.btn-primary {
  background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 10px;
  padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s;
}
.btn-primary:hover { filter: brightness(1.1); }
#uploadStatusText { font-size: 13px; color: var(--accent); }

.upload-preview-grid {
  flex: 1; overflow-y: auto; padding: 16px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  min-height: 200px; max-height: 50vh;
}
.preview-card {
  aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; background: var(--surface-2);
  position: relative;
}
.preview-card img { width: 100%; height: 100%; object-fit: cover; }
.loading, .empty-text { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>

  };
  const fallbackLang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  const state = {
    lang: store.get('gallery.lang'),
    images: [],
    loaded: false,
    sig: '',
    gridDirty: false,
    pending: null,
    selectMode: false,
    selected: new Set()
  };
  if (!I18N[state.lang]) state.lang = null;

  function t(key, params) {
    const dict = I18N[state.lang || fallbackLang];
    let s = dict[key];
    if (s === undefined) s = I18N.zh[key] !== undefined ? I18N.zh[key] : key;
    if (params) s = s.replace(/\{(\w+)\}/g, (_, k) => (params[k] !== undefined ? params[k] : ''));

  }

  /* 英文單複數：n === 1 時使用 key + 'One' */
  function tn(key, n) {
    const dict = I18N[state.lang || fallbackLang];
    return t(n === 1 && dict[key + 'One'] !== undefined ? key + 'One' : key, { n });
  }

  function applyLang() {
    document.documentElement.lang = (state.lang || fallbackLang) === 'zh' ? 'zh-Hant' : 'en';
    document.title = t('docTitle');
    $$('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $$('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });

    renderGalleryHeader();
    renderSelbar();
    updateLightboxUI();
  }
  function setLang(l) {
    state.lang = l;
    store.set('gallery.lang', l);
    applyLang();
  }

  /* ================= 路由（hash） ================= */
  const pages = $$('.page');
  function parseRoute() {
    const h = location.hash.replace(/^#\/?/, '');
    return h === 'gallery' ? h : 'home';
  }
  function go(r) { location.hash = '#/' + r; }
  function render() {
    const r = parseRoute();
    closeLangMenu();
    hideLightboxNow();
    if (r !== 'gallery') exitSelectMode();
    pages.forEach((p) => { p.hidden = p.dataset.page !== r; });
    document.body.dataset.route = r;
    window.scrollTo(0, 0);
    if (r === 'gallery') ensureGallery();
  }
  window.addEventListener('hashchange', render);

  /* 觸控裝置上，選完語言時嘗試進入全螢幕（iPhone 不支援，請用「加入主畫面」） */
  function tryFullscreen() {
    if (isStandalone() || document.fullscreenElement) return;
    if (!window.matchMedia('(pointer: coarse)').matches) return;
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn) return;
    try {
      const p = fn.call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => {});
    } catch (_) {}
  }

  /* ================= Toast / Modal / Busy ================= */
  let toastTimer = null;
  function toast(msg, ms = 2600) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
  }
  const openModal = () => { $('#modal').hidden = false; $('#modal-ok').focus(); };
  const closeModal = () => { $('#modal').hidden = true; };
  function showBusy(text, pct) {
    $('#busy').hidden = false;
    $('#busy-text').textContent = text;
    $('#busy-bar').style.width = Math.max(0, Math.min(100, pct)) + '%';
  }
  const hideBusy = () => { $('#busy').hidden = true; };

  /* ================= 資料層：相片清單（快取、預先載入、背景更新） ================= */
  const DATA_KEY = 'gallery.data.v2';
  const G_RE = /^https:\/\/lh3\.googleusercontent\.com\/d\/([\w-]+)/;
  const data = { fetchedAt: 0 };
  let refreshing = null;

  const roundUp = (v, step) => Math.ceil(v / step) * step;
  const dpr = (cap) => Math.min(window.devicePixelRatio || 1, cap);
  const gBase = (id) => CFG.googleBase + id;
  const previewPx = () => Math.min(2400, roundUp(Math.max(screen.width, screen.height) * dpr(2), 100));
  function thumbPx() {                       // 依欄數與螢幕密度，只要「剛好夠用」的縮圖尺寸
    const w = window.innerWidth;
    const cols = w >= 1500 ? 6 : w >= 1200 ? 5 : w >= 900 ? 4 : w >= 520 ? 3 : 2;
    const css = (w - 16 - (cols - 1) * 6) / cols;
    return Math.min(480, Math.max(160, roundUp(css * dpr(2), 40)));
  }
  let curThumbPx = 400;
  const urlThumb = (it, px) => (it.id ? gBase(it.id) + '=s' + px + '-c' : (it.thumb || it.full));
  const urlPreview = (it) => (it.id ? gBase(it.id) + '=s' + previewPx() : (it.full || it.thumb));
  const urlDownload = (it) => (it.id ? gBase(it.id) + '=' + (CFG.downloadPx ? 's' + CFG.downloadPx : 's0') : (it.download || it.full));

  function basename(u) {
    try { return decodeURIComponent(new URL(u, location.href).pathname.split('/').pop()) || 'image'; }
    catch (_) { return 'image'; }
  }
  /* 同時支援新格式 {id,name} 與舊格式 {name,thumb,full}（自動辨識 Google 圖片並改用最佳尺寸） */
  function normalize(item) {
    if (typeof item === 'string') item = { full: item };
    if (!item || typeof item !== 'object') return null;
    const full = item.full || item.url || item.src || null;
    const thumb = item.thumb || item.thumbnail || null;
    let id = item.id || null;
    if (!id) { const m = (full && G_RE.exec(full)) || (thumb && G_RE.exec(thumb)); if (m) id = m[1]; }
    if (!id && !full) return null;
    return { id, name: item.name || (full ? basename(full) : 'photo-' + id.slice(0, 8) + '.jpg'), thumb, full, download: item.download || null };
  }
  function parseServer(raw) {
    const list = Array.isArray(raw) ? raw : ((raw && raw.images) || []);
    if (raw && raw.error && !list.length) throw new Error(String(raw.error));

  }
  const signature = (imgs) => imgs.map((i) => (i.id || i.full) + '\u0001' + i.name).join('\u0002');

  /* ---- 清單：先用本機快取立即顯示，同時在背景向 Google 取最新版 ---- */
  const canRebuildNow = () => !(state.selectMode || lbOpen || busy);
  const galleryVisible = () => document.body.dataset.route === 'gallery';

  function setImages(list, sig) {
    if (galleryVisible() && state.loaded && !canRebuildNow()) { state.pending = { list, sig }; return; }

  function flushPending() {
    if (state.pending && canRebuildNow()) { const p = state.pending; state.pending = null; setImages(p.list, p.sig); }

  function refreshData() {
    if (refreshing) return refreshing;

        useData(raw);
        data.fetchedAt = Date.now();
        store.set(DATA_KEY, JSON.stringify({ t: data.fetchedAt, raw }));

      .catch((err) => { console.error('[gallery] refresh failed:', err); return false; })
      .finally(() => { clearTimeout(timer); refreshing = null; });

  function loadCached() {
    try {
      const c = JSON.parse(store.get(DATA_KEY));

  function showGalleryState(name) {

  }
  function ensureGallery() {
    if (Date.now() - data.fetchedAt > 60000) refreshData();      // 進入相簿時，若資料超過 1 分鐘就順便更新

      if (state.gridDirty || !$('#grid').children.length) rebuildGrid(false);

    showGalleryState('loading');
    refreshData().then(() => { if (!state.loaded) showGalleryState('error'); });
  });
  (function buildSkeleton() {
    const sk = $('#g-skel');
    for (let i = 0; i < 12; i++) { const d = document.createElement('div'); d.className = 'tile'; sk.appendChild(d); }
  })();

  /* ================= 相片格線 ================= */
  const grid = $('#grid'), sentinel = $('#g-sentinel');
  let rendered = 0, io = null;

  /* 縮圖延遲載入：只載入「可視範圍 + 600px」內的圖片，避免一次對 Google 發出大量請求（更快，也不易被限流） */
  let imgIO = null;
  function getImgIO() {
    if (!imgIO && 'IntersectionObserver' in window) {
      imgIO = new IntersectionObserver((es) => {
        es.forEach((e) => {
          if (!e.isIntersecting) return;
          const im = e.target.querySelector('img');
          if (im && im.dataset.src) { im.src = im.dataset.src; im.removeAttribute('data-src'); }
          imgIO.unobserve(e.target);
        });
      }, { rootMargin: '600px 0px' });
    }
    return imgIO;
  }
  function makeTile(i) {
    const it = state.images[i];
    const tile = document.createElement('div');
    tile.className = 'tile' + (state.selected.has(i) ? ' selected' : '');
    tile.dataset.index = i;
    tile.tabIndex = 0;
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-label', it.name);

    const img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    img.decoding = 'async';
    img.onload = () => tile.classList.add('loaded');
    img.onerror = () => tile.classList.add('broken');
    const url = urlThumb(it, curThumbPx);
    const lazy = i >= 8 && getImgIO();
    if (lazy) { img.dataset.src = url; lazy.observe(tile); }   // 接近可視範圍（上下約 600px）才開始下載
    else { img.fetchPriority = 'high'; img.src = url; }        // 首屏縮圖立刻、優先下載

    const check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('aria-hidden', 'true');
    check.innerHTML = '<svg class="ic"><use href="#i-check"/></svg>';
    tile.append(img, check);
    return tile;
  }
  /* 分批渲染：一次只建立一批，接近底部時才再建立下一批，數百張也不會卡 */
  function appendTiles(n) {
    const end = Math.min(state.images.length, rendered + n);
    const frag = document.createDocumentFragment();
    for (let i = rendered; i < end; i++) frag.appendChild(makeTile(i));
    grid.appendChild(frag);
    rendered = end;
    sentinel.hidden = rendered >= state.images.length;
    if (!sentinel.hidden && io) { io.unobserve(sentinel); io.observe(sentinel); }   // 重新觸發，直到畫面下方補滿
  }
  function rebuildGrid(keepScroll) {
    const y = window.scrollY, keep = keepScroll ? rendered : 0;
    curThumbPx = thumbPx();
    if (imgIO) imgIO.disconnect();
    grid.textContent = '';
    rendered = 0;
    state.gridDirty = false;
    if (!state.images.length) { showGalleryState('empty'); return; }
    showGalleryState('grid');
    if ('IntersectionObserver' in window) {
      if (!io) io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) appendTiles(CFG.chunkSize); }, { rootMargin: '1200px 0px' });
      appendTiles(Math.max(CFG.chunkSize, keep));
    } else {
      appendTiles(state.images.length);
    }
    if (keepScroll) window.scrollTo(0, y);
  }

  /* ---- 單點 / 長按 ---- */
  let pressTimer = null, pressTile = null, pressStart = null, longPressed = false;

  function cancelPress() {
    clearTimeout(pressTimer);
    pressTimer = null;
    if (pressTile) { pressTile.classList.remove('pressing'); pressTile = null; }
  }
  grid.addEventListener('pointerdown', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    longPressed = false;
    if (state.selectMode) return;                 // 多選模式中，單點即可勾選，不需要長按計時
    cancelPress();
    pressTile = tile;
    pressStart = { x: e.clientX, y: e.clientY };
    tile.classList.add('pressing');               // 視覺回饋：慢慢縮小
    pressTimer = setTimeout(() => {
      pressTimer = null;
      longPressed = true;
      tile.classList.remove('pressing');
      pressTile = null;
      if (navigator.vibrate) navigator.vibrate(25);  // 觸覺回饋（iOS 不支援）
      enterSelectMode(+tile.dataset.index);
    }, CFG.longPressMs);
  });
  grid.addEventListener('pointermove', (e) => {
    if (!pressTimer || !pressStart) return;
    if (Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 10) cancelPress();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => grid.addEventListener(ev, cancelPress));
  window.addEventListener('scroll', cancelPress, { passive: true });
  grid.addEventListener('contextmenu', (e) => e.preventDefault());   // 避免長按跳出「儲存圖片」選單

  grid.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    if (longPressed) { longPressed = false; return; }   // 長按放開後產生的 click 要略過
    const idx = +tile.dataset.index;
    if (state.selectMode) toggleSelect(idx);
    else openLightbox(idx);
  });
  grid.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('tile')) {
      e.preventDefault();
      e.target.click();
    }
  });

  /* ================= 多選模式 ================= */
  const tileAt = (i) => grid.children[i];
  function enterSelectMode(firstIndex) {
    state.selectMode = true;
    $('#page-gallery').classList.add('is-selecting');
    document.body.classList.add('selecting');
    $('#selbar').classList.add('show');
    $('#selbar').setAttribute('aria-hidden', 'false');
    if (firstIndex !== undefined) setSelected(firstIndex, true);
    refreshSelectionUI();
  }
  function exitSelectMode() {
    if (!state.selectMode && state.selected.size === 0) return;
    state.selectMode = false;
    state.selected.forEach((i) => { const el = tileAt(i); if (el) el.classList.remove('selected'); });
    state.selected.clear();
    $('#page-gallery').classList.remove('is-selecting');
    document.body.classList.remove('selecting');
    $('#selbar').classList.remove('show');
    $('#selbar').setAttribute('aria-hidden', 'true');
    refreshSelectionUI();
    flushPending();
  }
  function setSelected(i, on) {
    const el = tileAt(i);
    if (on) state.selected.add(i); else state.selected.delete(i);
    if (el) el.classList.toggle('selected', on);
  }
  function toggleSelect(i) {
    setSelected(i, !state.selected.has(i));
    refreshSelectionUI();
  }
  const allSelected = () => state.images.length > 0 && state.selected.size === state.images.length;
  function selectAllToggle() {
    const on = !allSelected();
    state.images.forEach((_, i) => setSelected(i, on));
    refreshSelectionUI();
  }
  function refreshSelectionUI() { renderGalleryHeader(); renderSelbar(); }

  function renderGalleryHeader() {
    const sel = state.selectMode;
    $('#g-title').textContent = sel ? t('selectedCount', { n: state.selected.size }) : t('galleryTitle');
    const sub = $('#g-sub');
    sub.textContent = tn('photoCount', state.images.length);
    sub.hidden = sel || !state.loaded;
    $('#g-back use').setAttribute('href', sel ? '#i-close' : '#i-back');
    $('#g-back').setAttribute('aria-label', t(sel ? 'cancel' : 'back'));
    const selAll = $('#g-selall');
    selAll.hidden = !sel;
    selAll.textContent = t(allSelected() ? 'deselectAll' : 'selectAll');
    $('#g-hint').hidden = sel || !state.images.length;
  }
  function renderSelbar() {
    $('#sel-count').textContent = t('selectedCount', { n: state.selected.size });
    $('#sel-download').disabled = state.selected.size === 0;
  }

  $('#g-back').addEventListener('click', () => { if (state.selectMode) exitSelectMode(); else go('home'); });
  $('#g-selall').addEventListener('click', selectAllToggle);
  $('#sel-cancel').addEventListener('click', exitSelectMode);
  $('#sel-download').addEventListener('click', downloadSelected);

  /* ================= 下載 ================= */
  const EXT = { 'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/gif': '.gif', 'image/avif': '.avif', 'image/svg+xml': '.svg', 'image/heic': '.heic' };

  async function fetchBlob(url) {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.blob();
  }
  function fileNameFor(item, blob) {
    let name = String(item.name || 'image').replace(/[\\/:*?"<>|]+/g, '_');
    if (!/\.[a-z0-9]{2,5}$/i.test(name)) name += EXT[blob.type] || '.jpg';
    return name;
  }
  function uniqueName(name, used) {
    let n = name, k = 1;
    const dot = name.lastIndexOf('.');
    const base = dot > 0 ? name.slice(0, dot) : name;
    const ext = dot > 0 ? name.slice(dot) : '';
    while (used.has(n.toLowerCase())) { k += 1; n = base + ' (' + k + ')' + ext; }
    used.add(n.toLowerCase());
    return n;
  }
  function saveBlob(blob, name) {
    if (typeof window.saveAs === 'function') { window.saveAs(blob, name); return; }
    const a = document.createElement('a');
    const u = URL.createObjectURL(blob);
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
  const stamp = () => {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  };

  let busy = false;
  async function downloadSelected() {
    if (busy) return;
    const idxs = Array.from(state.selected).sort((a, b) => a - b);
    if (!idxs.length) return;
    if (typeof window.JSZip === 'undefined') { toast(t('libMissing'), 4000); return; }

    busy = true;
    const total = idxs.length;
    let done = 0, failed = 0;
    showBusy(t('packing', { done: 0, total }), 0);

    const zip = new window.JSZip();
    const used = new Set();
    const queue = idxs.slice();
    const worker = async () => {
      while (queue.length) {
        const item = state.images[queue.shift()];
        try {
          const blob = await fetchBlob(urlDownload(item));
          zip.file(uniqueName(fileNameFor(item, blob), used), blob);
        } catch (err) {
          failed += 1;
          console.warn('[gallery] fetch failed:', item.full, err);
        }
        done += 1;
        showBusy(t('packing', { done, total }), (done / total) * 85);
      }
    };

    try {
      await Promise.all(Array.from({ length: Math.min(4, total) }, worker));
      if (failed === total) { toast(t('allFail'), 4500); return; }

      const out = await zip.generateAsync(
        { type: 'blob', compression: 'STORE' },          // 照片本身已壓縮，不必再壓，速度較快
        (m) => showBusy(t('zipping', { pct: Math.round(m.percent) }), 85 + m.percent * 0.15)
      );
      saveBlob(out, CFG.zipPrefix + '-' + stamp() + '.zip');

      const ok = total - failed;
      if (failed) toast(t('partialFail', { n: failed }), 4500);
      else { toast(tn('doneToast', ok)); exitSelectMode(); }
    } catch (err) {
      console.error('[gallery] zip failed:', err);
      toast(t('allFail'), 4500);
    } finally {
      hideBusy();
      busy = false;
      flushPending();
    }
  }

  async function downloadSingle(item) {
    toast(t('downloading'), 1600);
    try {
      const blob = await fetchBlob(urlDownload(item));
      saveBlob(blob, fileNameFor(item, blob));
    } catch (err) {
      console.warn('[gallery] direct download failed:', err);
      window.open(urlDownload(item), '_blank', 'noopener');      // 雲端空間沒開 CORS 時的備援
      toast(t('openedInstead'), 3500);
    }
  }

  /* ================= 燈箱 ================= */
  const lightbox = $('#lightbox'), lbImg = $('#lb-img');
  let lbOpen = false, lbIndex = -1, lbToken = 0;

  function openLightbox(i) {
    lbIndex = i;
    lbOpen = true;
    lightbox.hidden = false;
    document.body.classList.add('lock');
    history.pushState({ lb: 1 }, '', location.href);      // 讓手機「返回」鍵可以關閉燈箱
    showLbImage();
  }
  function showLbImage() {
    const item = state.images[lbIndex];
    if (!item) return;
    const token = ++lbToken;
    lbImg.classList.add('dim');
    $('#lb-spinner').hidden = false;
    lbImg.src = urlThumb(item, curThumbPx);                // 先顯示已載入的縮圖（瀏覽器快取），再換成高解析
    const full = urlPreview(item);
    const pre = new Image();
    pre.onload = () => {
      if (token !== lbToken) return;
      lbImg.src = full;
      lbImg.classList.remove('dim');
      $('#lb-spinner').hidden = true;
      [lbIndex + 1, lbIndex - 1].forEach((j) => {         // 預載前後各一張，切換時幾乎瞬間顯示
        const nb = state.images[j];
        if (nb) new Image().src = urlPreview(nb);
      });
    };
    pre.onerror = () => {
      if (token !== lbToken) return;
      $('#lb-spinner').hidden = true;
      toast(t('imgFail'));
    };
    pre.src = full;
    updateLightboxUI();
  }
  function updateLightboxUI() {
    if (!lbOpen) return;
    $('#lb-counter').textContent = (lbIndex + 1) + ' / ' + state.images.length;
    $('#lb-prev').disabled = lbIndex <= 0;
    $('#lb-next').disabled = lbIndex >= state.images.length - 1;
  }
  function stepLightbox(d) {
    const n = lbIndex + d;
    if (n < 0 || n >= state.images.length) return;
    lbIndex = n;
    showLbImage();
  }
  function hideLightboxNow() {
    if (!lbOpen) return;
    lbOpen = false;
    lbToken += 1;
    lightbox.hidden = true;
    lbImg.removeAttribute('src');
    document.body.classList.remove('lock');
    flushPending();
  }
  function closeLightbox() { if (lbOpen) history.back(); }   // 由 popstate 實際關閉

  window.addEventListener('popstate', () => { if (lbOpen) hideLightboxNow(); });
  $('#lb-close').addEventListener('click', closeLightbox);
  $('#lb-download').addEventListener('click', () => downloadSingle(state.images[lbIndex]));
  $('#lb-prev').addEventListener('click', () => stepLightbox(-1));
  $('#lb-next').addEventListener('click', () => stepLightbox(1));

  let sx = 0, sy = 0, tracking = false;                      // 左右滑動切換
  lightbox.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { tracking = false; return; }
    tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  lightbox.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) stepLightbox(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ================= 2. 上傳預覽彈窗邏輯 (V1.3) ================= */
  let touchStartY = 0;
  let touchMoveY = 0;

  window.openUploadModal = async function() {
    document.getElementById('uploadModal').style.display = 'flex';
    document.body.classList.add('lock');
    await fetchUploadedImages();
    setupPullToRefresh();
  };

  window.closeUploadModal = function() {
    document.getElementById('uploadModal').style.display = 'none';
    document.body.classList.remove('lock');
  };

  async function fetchUploadedImages(isRefresh = false) {
    const grid = document.getElementById('uploadPreviewGrid');
    if (!isRefresh) grid.innerHTML = '<div class="loading">載入中...</div>';
    
    try {
      const url = `${GAS_API_URL}?action=getUploads${isRefresh ? '&refresh=true' : ''}`;
      const res = await fetch(url);
      const data = await res.json();
      
      if (data.status === 'success') {
        renderUploadGrid(data.images);
      } else {
        grid.innerHTML = '<div class="empty-text">載入失敗：' + (data.message || '無法取得資料') + '</div>';
      }
    } catch (err) {
      console.error('取得上傳照片失敗', err);
      grid.innerHTML = '<div class="empty-text">連線失敗，請稍後再試</div>';
    }
  }

  function renderUploadGrid(images) {
    const grid = document.getElementById('uploadPreviewGrid');
    if (!images || images.length === 0) {
      grid.innerHTML = '<div class="empty-text">目前尚無上傳照片</div>';
      return;
    }
    grid.innerHTML = images.map(img => `
      <div class="preview-card">
        <img src="${img.thumb}" alt="${img.name}" loading="lazy">
      </div>
    `).join('');
  }

  function setupPullToRefresh() {
    const container = document.getElementById('uploadPreviewGrid');
    const indicator = document.getElementById('pullRefreshIndicator');
    if (!container || !indicator) return;

    container.addEventListener('touchstart', (e) => {
      if (container.scrollTop === 0) {
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      touchMoveY = e.touches[0].clientY;
      const pullDistance = touchMoveY - touchStartY;

      if (container.scrollTop === 0 && pullDistance > 0) {
        indicator.style.height = `${Math.min(pullDistance / 2, 50)}px`;
        indicator.classList.toggle('ready', pullDistance > 80);
      }
    }, { passive: true });

    container.addEventListener('touchend', async () => {
      const pullDistance = touchMoveY - touchStartY;
      if (container.scrollTop === 0 && pullDistance > 80) {
        indicator.innerHTML = '🔄 更新中...';
        await fetchUploadedImages(true);
        indicator.innerHTML = '✓ 更新完成';
      }
      setTimeout(() => {
        indicator.style.height = '0px';
        indicator.innerHTML = '<span class="refresh-icon">↓</span> 下拉更新預覽...';
      }, 600);
      touchStartY = 0;
      touchMoveY = 0;
    });
  }

  window.handleFileSelect = async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 20 * 1024 * 1024) {
      alert('照片檔案過大，請選擇 20MB 以內的圖片');
      return;
    }

    if (!file.type.startsWith('image/')) {
      alert('僅支援圖片檔案');
      return;
    }

    const statusText = document.getElementById('uploadStatusText');
    statusText.innerText = '上傳中...';

    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64Data = e.target.result;
      
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            fileName: file.name,
            fileData: base64Data
          })
        });
        
        const result = await response.json();
        if (result.status === 'success') {
          statusText.innerText = '上傳完成！';
          fetchUploadedImages(true);
        } else {
          alert('上傳失敗：' + result.message);
          statusText.innerText = '';
        }
      } catch (err) {
        alert('上傳發生錯誤：' + err.toString());
        statusText.innerText = '';
      }
    };
    reader.readAsDataURL(file);
  };

  /* ================= 語言下拉選單 ================= */
  const langSwitch = $('.lang-switch'), langToggle =$('#lang-toggle'), langMenu = $('#lang-menu');   function openLangMenu() {     langSwitch.classList.add('open');     langToggle.setAttribute('aria-expanded', 'true');     langMenu.hidden = false;   }   function closeLangMenu() {     langSwitch.classList.remove('open');     langToggle.setAttribute('aria-expanded', 'false');     langMenu.hidden = true;   }   langToggle.addEventListener('click', (e) => {     e.stopPropagation();     if (langMenu.hidden) openLangMenu(); else closeLangMenu();   });   $$('#lang-menu [data-lang]').forEach((li) => li.addEventListener('click', () => {
    setLang(li.dataset.lang);
    closeLangMenu();
  }));
  document.addEventListener('click', (e) => { if (!langSwitch.contains(e.target)) closeLangMenu(); });

  /* ================= 其他事件 ================= */
  $('#btn-gallery').addEventListener('click', () => { tryFullscreen(); go('gallery'); });
  $('#btn-soon').addEventListener('click', () => { tryFullscreen(); openUploadModal(); }); // 點擊開啟上傳彈窗
  $('#modal-ok').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });

  document.addEventListener('keydown', (e) => {
    if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
    if (lbOpen) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') stepLightbox(-1);
      else if (e.key === 'ArrowRight') stepLightbox(1);
      return;
    }
    if (!langMenu.hidden && e.key === 'Escape') { closeLangMenu(); return; }
    if (e.key === 'Escape' && state.selectMode) exitSelectMode();
  });

  /* ================= 啟動 ================= */
  $('#install-hint').hidden = isStandalone();
  loadCached();          // 有上次的清單就立刻可用
  applyLang();
  render();
  refreshData();         // 一開啟網頁就在背景向 Google 取最新清單與背景圖，選完語言時通常已備妥
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - data.fetchedAt > 120000) refreshData();
  });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
