<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QR Code 產生器</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
  :root{--bg:#111214;--surface:#181a1d;--line:rgba(255,255,255,.1);--text:#f0ede6;--muted:#8f9399;--accent:#f0b35a;--ink:#1c1206;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
  main{max-width:560px;margin:0 auto;padding:32px 20px 56px}
  h1{margin:0 0 6px;font-family:"Iowan Old Style","Palatino Linotype","Noto Serif TC","Songti TC",Georgia,serif;font-size:30px}
  p.lead{margin:0 0 24px;color:var(--muted)}
  label{display:block;margin:18px 0 6px;font-size:14px;font-weight:600}
  input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex;gap:10px;margin-top:18px}
  button{flex:1;padding:13px 16px;border:0;border-radius:12px;font:inherit;font-weight:650;cursor:pointer;background:rgba(255,255,255,.09);color:var(--text)}
  button.primary{background:var(--accent);color:var(--ink)}
  .preview{margin-top:28px;display:grid;place-items:center;padding:18px;border-radius:18px;background:#fff}
  canvas{max-width:100%;height:auto;image-rendering:pixelated}
  .msg{margin-top:14px;color:var(--muted);font-size:14px}
  .msg.err{color:#ff8d8d}
  #qr-tmp{position:absolute;left:-9999px;top:0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';document.head.appendChild(s)"></script>
</head>
<body>
<main>
  <h1>QR Code 產生器</h1>
  <p class="lead">貼上網站網址，產生 QR Code 圖片。用手機掃描後會直接開啟相簿網站。</p>

  <label for="url">網站網址</label>
  <input id="url" type="url" inputmode="url" placeholder="https://你的帳號.github.io/你的專案名稱/" autocomplete="off">

  <label for="size">圖片大小</label>
  <select id="size">
    <option value="256">小（256 px）</option>
    <option value="512" selected>中（512 px）</option>
    <option value="1024">大（1024 px，適合印刷）</option>
  </select>

  <div class="row">
    <button class="primary" id="make">產生 QR Code</button>
    <button id="save" disabled>下載 PNG</button>
  </div>

  <p class="msg" id="msg"></p>
  <div class="preview" id="preview" hidden><canvas id="qr" width="10" height="10"></canvas></div>
  <div id="qr-tmp" aria-hidden="true"></div>
</main>

<script>
window.addEventListener('load', function () {
  var $ = function (id) { return document.getElementById(id); };
  var urlInput = $('url'), msg = $('msg');

  // 預設帶入這個工具所在資料夾的網址（也就是 index.html 所在位置）
  if (/^https?:/.test(location.href)) urlInput.value = location.href.replace(/qr\.html.*$/, '');

  function say(text, err) { msg.textContent = text; msg.className = 'msg' + (err ? ' err' : ''); }

  function make() {
    var text = urlInput.value.trim();
    var size = parseInt($('size').value, 10);
    if (!text) { say('請先輸入網站網址。', true); return; }
    if (typeof QRCode === 'undefined') { say('QR Code 元件沒有載入，請檢查網路後重新整理。', true); return; }
    try {
      var tmp = $('qr-tmp'); tmp.innerHTML = '';
      new QRCode(tmp, { text: text, width: size, height: size, colorDark: '#111214', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
      var src = tmp.querySelector('canvas');
      var pad = Math.round(size * 0.08);                       // 白色安靜區，掃描比較穩
      var c = $('qr'); c.width = c.height = size + pad * 2;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(src, pad, pad);
      $('preview').hidden = false; $('save').disabled = false;
      say('完成。請用手機掃描確認能開啟網站，再下載圖片。');
    } catch (e) {
      say('網址太長或內容無法編碼，請縮短後再試。', true);
    }
  }
  function save() {
    $('qr').toBlob(function (b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'gallery-qrcode.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    }, 'image/png');
  }
  $('make').addEventListener('click', make);
  $('save').addEventListener('click', save);
  $('size').addEventListener('change', function () { if (!$('preview').hidden) make(); });
  urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') make(); });
  if (urlInput.value) make();
});
</script>
</body>
</html>
